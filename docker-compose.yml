services:
  db:
    image: postgres:16-alpine
    container_name: lexora_db
    environment:
      POSTGRES_USER: lexora
      POSTGRES_PASSWORD: lexora_dev_password
      POSTGRES_DB: lexora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lexora_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lexora:lexora_dev_password@db:5432/lexora
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: lexora_frontend
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  postgres_data: